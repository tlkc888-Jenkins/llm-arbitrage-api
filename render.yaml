# Render Blueprint - MCPHub

services:
  - type: web
    name: mcphub
    runtime: node
    plan: free
    buildCommand: npm install && npm run seed
    startCommand: npm start
    healthCheckPath: /api/v1/stats
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: ADMIN_KEY
        generateValue: true
