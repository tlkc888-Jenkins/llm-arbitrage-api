# Render Blueprint - SavvyLLM API

services:
  - type: web
    name: savvyllm-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: BASE_URL
        sync: false  # Set manually after deploy
      - key: JWT_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false  # Set manually
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false  # Set manually
      - key: STRIPE_WEBHOOK_SECRET
        sync: false  # Set manually
      - key: STRIPE_PRICE_STARTER
        sync: false  # Set manually
      - key: STRIPE_PRICE_PRO
        sync: false  # Set manually
      - key: STRIPE_PRICE_OVERAGE
        sync: false  # Set manually
